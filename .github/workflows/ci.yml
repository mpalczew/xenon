name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      # Single source of truth: the same checks developers run locally via
      # .project.sh and the pre-commit hooks (fmtcheck, lint, lint_shape, test).
      - run: source .project.sh && project_health
