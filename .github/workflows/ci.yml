name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      # Single source of truth: the same checks developers run locally via
      # Same gates as pre-commit + test (scripts/health = tasks.json "health").
      - run: scripts/health
