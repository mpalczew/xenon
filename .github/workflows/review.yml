name: Review

on:
  push:
    branches: [main]
    paths-ignore:
      - ".xenon/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review with Claude Sonnet
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          claude -p --model sonnet --permission-mode dontAsk \
            --allowedTools 'Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)' \
            -- "Read docs/review.md and AGENTS.md, then review \`git diff $BEFORE $GITHUB_SHA\`. Review only; do not edit files. Reply with only the findings in the format docs/review.md asks for, or \"No findings\"." \
            > review.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@review.md
