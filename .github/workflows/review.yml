name: Review

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review with Claude Sonnet
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if ! printf '%s\n' "$files" | grep -qvE '^(\.xenon/|docs/)|\.md$'; then
            echo "Docs-only push; no review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          claude -p --model sonnet --permission-mode dontAsk \
            --allowedTools 'Read,Grep,Glob,WebSearch,WebFetch,Bash(git diff:*),Bash(git log:*),Bash(git show:*)' \
            -- "Read docs/review.md and AGENTS.md, then review \`git diff $BEFORE $GITHUB_SHA\`. Review only; do not edit files. Reply with only the findings in the format docs/review.md asks for, or \"No findings\"." \
            > review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$(tr -d '\n.' < review.md)" != "No findings" ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@review.md
          fi
