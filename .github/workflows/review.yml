name: Review

on:
  push:
    branches: [main]
    paths-ignore:
      - ".xenon/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: write
  id-token: write

concurrency:
  group: review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model sonnet
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh api:*)"
          prompt: |
            Read docs/review.md and AGENTS.md, then review `git diff ${{ github.event.before }} ${{ github.sha }}`.
            Review only; do not edit files.
            Post your findings as one commit comment on ${{ github.sha }} with
            `gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body=...`.
            If there are no findings, post "No findings".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
