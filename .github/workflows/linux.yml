name: Linux

# The Linux build check. macOS is checked locally by scripts/health; this keeps
# Linux honest without building on a particular machine.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang lld pkg-config ripgrep \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev libvulkan-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xkb-dev libzstd-dev libsqlite3-dev libgit2-dev libva-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/health
