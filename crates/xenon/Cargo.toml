[package]
name = "xenon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "xenon"
path = "src/main.rs"

[[bin]]
name = "xenon_visual_test_runner"
path = "src/visual_test_runner.rs"
required-features = ["visual-tests"]

[features]
default = []
visual-tests = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "xenon_ui/visual-tests",
    "dep:anyhow",
    "dep:image",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
anyhow = { workspace = true, optional = true }
async-channel.workspace = true
env_logger = "0.11"
image = { version = "0.25.10", optional = true }
log = "0.4"
gpui.workspace = true
gpui_platform.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
xenon_core.workspace = true
xenon_store.workspace = true
xenon_terminal.workspace = true
xenon_ui.workspace = true
