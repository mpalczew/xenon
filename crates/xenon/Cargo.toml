[package]
name = "xenon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
xenon_core.workspace = true
anyhow.workspace = true
xenon_store.workspace = true
xenon_settings.workspace = true
xenon_prose.workspace = true
xenon_finder.workspace = true
xenon_remote.workspace = true
xenon_git.workspace = true
async-channel.workspace = true
qrcode = { version = "0.14", default-features = false }
nucleo.workspace = true
serde_json.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gio = { version = "0.22", features = ["v2_72"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
sourceview = { package = "sourceview5", version = "0.11", features = ["v5_18"] }
vte = { package = "vte4", version = "0.10", features = ["v0_84"] }
similar = { version = "3.2.1", features = ["inline", "text"] }

[lints]
workspace = true
