[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unused = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
result_large_err = "warn"
todo = "deny"
too_many_arguments = "warn"
unimplemented = "deny"

[workspace.dependencies]
xenon_core = { path = "crates/xenon_core" }
xenon_store = { path = "crates/xenon_store" }
xenon_finder = { path = "crates/xenon_finder" }
xenon_git = { path = "crates/xenon_git" }
xenon_remote = { path = "crates/xenon_remote" }
xenon_settings = { path = "crates/xenon_settings" }
xenon_prose = { path = "crates/xenon_prose" }
xenon_keymap = { path = "crates/xenon_keymap" }

anyhow = "1"
thiserror = "2"
async-channel = "2"
tungstenite = "0.24"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
pulldown-cmark = { version = "0.12", default-features = false }
nucleo = "0.5"
ignore = "0.4"
notify = "8"

# Local builds are the only builds: optimized (opt-level 3) so the app is usable,
# incremental, no LTO. Packed debuginfo, because unpacked writes one .o per
# codegen unit into target/debug/deps and Cargo never removes the old ones.
[profile.dev]
opt-level = 3
incremental = true
codegen-units = 256
lto = false
debug = "line-tables-only"
split-debuginfo = "packed"
